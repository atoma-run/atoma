name: CI

on:
  push:
  pull_request:
  # The browser smoke below is MANUAL only. See its job for why.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never discard the worker proof for a commit already on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  mender-isolation:
    name: Mender credential isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: docker build -f docker/mender.Dockerfile -t atoma-mender:local .
      - run: npx vitest run tests/mender-isolation.test.ts
        env:
          ATOMA_MENDER_CONTAINER_TESTS: '1'

  # `release:check` is ONE definition — `release:check:static && npm test` in
  # package.json — run here as its two halves side by side. One after the
  # other they were the whole critical path to a deployment, about 4.5 min of
  # it (2026-09-27); side by side the longer half is. `core` below is the
  # single required check that says both passed.
  static:
    name: Static checks and release build (Node ${{ matrix.line }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '24.20.0'
            line: '24'
    runs-on: ubuntu-latest
    # `viz:smoke` no longer runs here (see release:check), so this step is
    # hermetic work: docs, types, lint, audit, build, and the node-only release
    # smokes. The browser arms were what made the step's cost swing ~1.7x with
    # nothing but which machine picked the job up.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run release:check:static

      - name: Package the exact main revision for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node == '24.20.0'
        shell: bash
        run: |
          set -euo pipefail
          root="atoma-${GITHUB_SHA}"
          mkdir -p "deployment/${root}"
          cp -R dist docker scripts deploy src docs "deployment/${root}/"
          cp package.json package-lock.json .env.example AGENTS.md CLAUDE.md "deployment/${root}/"
          node scripts/supervisor-release-smoke.mjs "deployment/${root}"
          printf '%s\n' "${GITHUB_SHA}" > "deployment/${root}/REVISION"
          tar -C deployment -czf "deployment/${root}.tar.gz" "${root}"
          (cd deployment && sha256sum "${root}.tar.gz" > "${root}.tar.gz.sha256")

      - name: Upload immutable deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node == '24.20.0'
        uses: actions/upload-artifact@v4
        with:
          name: atoma-deploy-${{ github.sha }}
          path: |
            deployment/atoma-${{ github.sha }}.tar.gz
            deployment/atoma-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Test suite (Node ${{ matrix.line }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '24.20.0'
            line: '24'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      # LibreOffice (the legacy document tests) installs from apt WHILE npm ci
      # installs from the registry. One after the other they cost 50–80 s on
      # the job every deployment waits for (2026-09-27). The background job's
      # own stdio is detached, or the runner would wait for it at step end;
      # the "finish" step below waits for its status and keeps its log.
      # A stalled mirror or a held dpkg lock hung this for the whole 25-minute
      # job, with no log, on 2026-09-30: every apt wait is bounded, and so is
      # the finish step, which prints the log when it gives up. The same day
      # the bound fired: the Azure mirror took over ten minutes on the ~100 MB
      # of packages. So the .debs are CACHED, keyed by the runner image, and
      # a new image restores the previous image's set and fetches only what
      # changed; the mirror serves the package lists and nothing else.
      - name: Key the LibreOffice package cache by runner image
        id: libreoffice-key
        run: echo "key=libreoffice-debs-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: libreoffice-cache
        with:
          path: ~/.cache/libreoffice-debs
          key: ${{ steps.libreoffice-key.outputs.key }}
          restore-keys: libreoffice-debs-
      - name: Start installing LibreOffice for document tests
        run: |
          mkdir -p ~/.cache/libreoffice-debs
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 -o Dir::Cache::Archives=$HOME/.cache/libreoffice-debs -o APT::Keep-Downloaded-Packages=true"
          (
            {
              sudo apt-get $apt_opts update &&
              sudo apt-get $apt_opts install -y --no-install-recommends \
                libreoffice-writer libreoffice-calc libreoffice-impress &&
              sudo apt-get $apt_opts autoclean
            } > "$RUNNER_TEMP/libreoffice.log" 2>&1
            echo $? > "$RUNNER_TEMP/libreoffice.status"
          ) > /dev/null 2>&1 < /dev/null &
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Finish installing LibreOffice for document tests
        run: |
          waited=0
          until [ -f "$RUNNER_TEMP/libreoffice.status" ]; do
            if [ "$waited" -ge 600 ]; then
              echo "::error::LibreOffice install still running after 10 minutes"
              cat "$RUNNER_TEMP/libreoffice.log"
              exit 1
            fi
            sleep 1
            waited=$((waited + 1))
          done
          if [ "$(cat "$RUNNER_TEMP/libreoffice.status")" != 0 ]; then
            cat "$RUNNER_TEMP/libreoffice.log"
            exit 1
          fi
          tail -n 3 "$RUNNER_TEMP/libreoffice.log"
          soffice --headless --version
          # apt wrote the cache as root, and its partial/ as _apt with 0700:
          # the save below runs as the runner user and must read it all.
          sudo rm -rf ~/.cache/libreoffice-debs/partial
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/libreoffice-debs
          echo "$(ls ~/.cache/libreoffice-debs/*.deb | wc -l) packages in the cache"
      # Saved as soon as the install succeeded, not at job end: a red suite
      # must not send the next run back to the mirror.
      - uses: actions/cache/save@v6
        if: steps.libreoffice-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/libreoffice-debs
          key: ${{ steps.libreoffice-key.outputs.key }}
      - run: npm test

  core:
    # The check name carries the Node LINE, not the pinned patch version: the
    # `protect-main` ruleset requires these checks by name, and a version bump
    # must not silently orphan a required check. It is the gate over BOTH
    # halves of `release:check`, and it runs WHATEVER they did, a cancelled
    # run included: a job skipped — by a failed dependency or by its own
    # `if` — reports as passing to a required check, so this one always runs
    # and fails unless it read two successes.
    name: Hermetic checks (Node ${{ matrix.line }})
    needs: [static, tests]
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '24.20.0'
            line: '24'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both halves of release:check passed
        run: |
          echo "static: ${{ needs.static.result }}, tests: ${{ needs.tests.result }}"
          test "${{ needs.static.result }}" = success
          test "${{ needs.tests.result }}" = success

  i18n:
    name: Translate blank locale values
    # The auto-translation half of the locale pipeline (the manual half is the
    # pre-commit hook that blanks stale target values when en.json changes).
    # A STEP of this CI run, not a second workflow: one runner, one queue, one
    # place to read the pipeline's health. `translate` isolates locales, and
    # the commit step below runs ALWAYS: partial work is never dropped with
    # the runner. A hard failure or surviving blank makes the job RED.
    #
    # `check` failing turns the job RED but does NOT hold the commit back —
    # both steps are `always()`, deliberately, because a runner that dies with
    # paid translations on its disk is the incident this pipeline exists to
    # avoid. The comment here used to claim the opposite (2026-08-27, 2.6);
    # translate and check share ONE
    # blank predicate (`scripts/i18n-predicates.mjs`), so translate cannot write a
    # malformed value check refuses — the shape that made this job red FOREVER,
    # since no later pass could see it to repair it. Completeness is required
    # here too: valid partial catalogs do not mean translation succeeded.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # Job-level: this job commits translations; the rest of CI stays read-only.
      contents: write
    concurrency:
      # Run-level group instead of the workflow's branch group: two pushes to
      # main may safely overlap elsewhere, but never two translation commits.
      group: i18n-translate-${{ github.ref }}
      # QUEUE, never cancel (2026-08-28, run 33130929613): cancelling an
      # in-flight translate can drop paid work, and the dying job's always()
      # commit step can still push WHILE the newer job is already checked out,
      # recreating the stale-tree race the tip checkout below closes. Letting
      # the running job land and starting the next from the tip is lossless.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # The BRANCH TIP, not the pushed sha (2026-08-28, run 33130929613):
          # this job's subject is the branch's catalogs, so a translation
          # commit landed between the push and this job starting must be
          # visible here. Checked out at the trigger sha, this job once
          # re-translated 6 already-filled catalogs (paid twice) and produced
          # a commit that could never rebase past the one on main — same
          # lines, different model output — so the push loop below exhausted.
          # `invalidate-range` stays correct: it compares en.json at `--since`
          # against the WORKING TREE, and a newer tree only widens the range.
          ref: ${{ github.ref_name }}
          # FULL history, because `invalidate-range` below compares en.json
          # against the commit this push started from — which is `HEAD^` only
          # when the push carried exactly one commit. A depth of 2 would make
          # every batched push silently skip the invalidation for all but its
          # last commit, which is the failure this step exists to prevent.
          fetch-depth: 0
          # The translation commit is pushed straight to main, and the
          # `protect-main` ruleset (.github/rulesets/) only lets the repository
          # admin bypass its pull-request rule: GitHub Actions cannot be a
          # bypass actor on a user-owned repository. So the push authenticates
          # with the admin's fine-grained token (Contents: read/write on this
          # repository) rather than the workflow token. The `[skip ci]` in the
          # commit message is what keeps that push from re-triggering CI, which
          # a token push would otherwise do. Without the secret the workflow
          # token is used and the push is refused by the ruleset.
          token: ${{ secrets.ATOMA_I18N_PUSH_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      # No npm ci: the i18n script is dependency-free (node:fs, node:child_process).

      # SEMANTIC DRIFT, replayed server-side (2026-08-27, 2.7). An EN value
      # rewritten without touching its placeholders is invisible to both steps
      # below — they compare placeholder signatures, and a reworded sentence
      # keeps its own. The pre-commit hook was the only guard, and it is skipped
      # when CI=true (scripts/husky-install.mjs), bypassed by --no-verify, and
      # absent from the GitHub web editor. Same invalidation code as the hook,
      # different trigger: a push range instead of the index.
      - name: Blank translations whose EN source changed meaning
        run: node scripts/i18n.mjs invalidate-range --since=${{ github.event.before }}

      - name: Blank placeholder-drifted values
        run: node scripts/i18n.mjs fix-drift --apply

      - name: Translate missing keys
        env:
          # GitHub cannot reuse a developer's personal ChatGPT Pro session.
          # CI therefore uses the separately billed OpenAI API credential.
          ATOMA_I18N_BACKEND: openai
          ATOMA_I18N_CODEX_MODEL: gpt-5.6-sol
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/i18n.mjs translate
        # Keep the failure: continue-on-error hid exhausted API credits and
        # left 84 values untranslated in a green job (2026-09-14).
        # The always() guards below alone preserve every catalog earned.

      - name: Verify locale health
        if: always()
        run: node scripts/i18n.mjs check --require-complete

      - name: Commit translated locale files
        # Save partial progress even when translation or verification failed.
        # A successful commit must not erase either earlier step's failure.
        if: always()
        run: |
          git config user.name "atoma-i18n-bot"
          git config user.email "actions@github.com"
          git add src/viz/client/locales
          if git diff --cached --quiet; then
            echo "No locale changes to commit."
          else
            git commit -m "chore(i18n): auto-translate missing locale values [skip ci]"
            # A push may land on main during the ~30 min translate window;
            # rebasing onto it beats failing the job over a fast-forward race.
            #
            # ABORT BEFORE RETRYING (2026-08-27, 3.10): a rebase that stops on
            # a conflict leaves the tree mid-rebase, and the next `pull
            # --rebase` refuses outright — so attempts 2 and 3 could only fail,
            # whatever the state of main. The abort restores a clean HEAD so a
            # retry is a real second chance; a genuine content conflict still
            # exhausts the loop and exits 1, which is the honest outcome.
            for attempt in 1 2 3; do
              if git -c user.name="atoma-i18n-bot" -c user.email="actions@github.com" \
                  pull --rebase --autostash origin "${{ github.ref_name }}" && \
                 git push origin "HEAD:${{ github.ref_name }}"; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "push rejected (attempt $attempt); rebasing and retrying…"
              sleep $((attempt * 10))
            done
            echo "could not land the translation commit after 3 attempts" >&2
            exit 1
          fi

  viz-smoke:
    name: Browser smoke (manual)
    # MANUAL ONLY, and best-effort. `viz:smoke` left `release:check` on
    # 2026-08-24 because on CI's CPU rasteriser it measured 2023–3433ms per
    # frame against ~17ms on a developer machine: it failed on its own timing
    # rather than on the change under test, three CI-only flakes in one day.
    # That decision stands — this job does not re-arm it. What it adds is a
    # button: since 03de3f7 the only automatic guard on the client bundle
    # boundary is a source scan (`tests/viz-client-bundle-boundary.test.ts`),
    # and being able to ask for the behavioural proof from a PR page costs
    # nothing while nobody asks (2026-08-27, 3.6).
    #
    # `continue-on-error` is the honest setting: a red run here is evidence to
    # read, not a verdict, because the runner is the wrong machine to measure
    # frame time on. The real proof stays `npm run viz:smoke` on real hardware
    # before shipping a viz change.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run viz:smoke

  preview-runtime:
    name: Preview isolation under gVisor (manual)
    # MANUAL AND NON-GATING, deliberately, and for the same reason `viz:smoke`
    # left `release:check` on 2026-08-24: this is the one check here whose
    # subject is an ENVIRONMENT rather than the change under test. gVisor is a
    # third-party runtime installed from an external apt repository at job
    # time, so a red run can mean the repository moved, not that the preview
    # broke. Making it required would let someone else's outage block a
    # merge.
    #
    # It exists because everything else about the preview runtime is asserted
    # at the COMMAND level — what the launcher would tell the engine to do —
    # and that is the right test for a flag and no test at all of the
    # boundary. A preview runs a tenant's model-authored application in a
    # member's browser session; `runsc` is what the design requires in
    # production and forbids falling back from silently, so the promise needs
    # a real sandbox to be worth anything.
    #
    # No `/dev/kvm` is needed: gVisor's default platform since mid-2023 is
    # systrap, which traps syscalls through seccomp rather than hardware
    # virtualisation, and GitHub-hosted runners do not expose KVM.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Install gVisor
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl -fsSL https://gvisor.dev/archive.key             | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main"             | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
      - name: Prove the runtime is registered before trusting it
        run: |
          set -euo pipefail
          docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'
          docker run --rm --runtime=runsc hello-world
      - run: npm run build:worker:dev
      - run: npm run build:preview
      - name: Preview isolation and network
        run: npx vitest run tests/preview-isolation.test.ts tests/preview-egress.test.ts tests/preview-terminal-container.test.ts
        env:
          # Absence becomes a hard failure HERE and nowhere else: the suite
          # skips this file everywhere a contributor lacks gVisor, and a job
          # that installed it must never report a skip as a pass.
          CI_REQUIRE_PREVIEW_RUNTIME: "1"
          CI_REQUIRE_DOCKER: "1"
          ATOMA_TEST_PREVIEW_IMAGE: atoma-preview:latest

  worker:
    name: Fresh worker image
    # BESIDE `core`, not after it: it builds and tests its own image from its
    # own checkout and consumes nothing `core` produces. Chained, its 1.6 min
    # was added to every deployment's wait for no proof it did not already
    # give on its own (2026-09-27).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run build:worker:dev
      - run: test -f dist/tools/worker.js && test -f dist/contracts/probeManifest.js
      - run: npm run build:preview
      - run: npx vitest run tests/container-isolation.test.ts tests/preview-egress.test.ts tests/preview-terminal-container.test.ts
        env:
          CI_REQUIRE_DOCKER: "1"
          ATOMA_TEST_PREVIEW_IMAGE: atoma-preview:latest
