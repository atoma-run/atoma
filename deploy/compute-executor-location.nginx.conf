# Include inside the HTTPS atoma.run server. Nginx owns the device connection
# directly: restarting the web/API cannot cut an executing device's WSS stream.
location = /compute/v1 {
    proxy_pass http://atoma_compute_executor;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 24h;
    proxy_buffering off;
}
