# Install only after the wildcard certificate exists.
server {
    listen 443 ssl;
    server_name *.app.atoma.run;
    ssl_certificate /etc/letsencrypt-preview/live/atoma-apps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-preview/live/atoma-apps/privkey.pem;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:4411;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
