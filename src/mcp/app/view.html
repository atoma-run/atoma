<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atoma</title><style>
:root{color-scheme:light dark;font-family:var(--font-sans,system-ui,sans-serif);color:var(--color-text-primary,CanvasText);background:var(--color-background-primary,Canvas)}
*{box-sizing:border-box}main{overflow-wrap:anywhere}body{margin:0;padding:20px;font-size:14px;line-height:1.5}h1{font-size:20px;margin:0 0 8px}h2{font-size:15px;margin:20px 0 8px}p{margin:6px 0}.muted{opacity:.7;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,a{font:inherit}button{font-size:12px;line-height:1.4;min-height:26px;padding:3px 8px;border:1px solid var(--color-border-primary,GrayText);border-radius:6px;background:var(--color-background-secondary,ButtonFace);color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible{outline:2px solid Highlight;outline-offset:3px}ul{padding-left:20px}li{margin:7px 0;overflow-wrap:anywhere}#files{list-style:none;padding:0}#files>li{border-bottom:1px solid var(--color-border-secondary,ButtonFace);padding-bottom:9px}.file-row{display:flex;gap:8px;align-items:center}.file-toggle{display:flex;gap:8px;align-items:baseline;min-width:0;flex:1;text-align:start;border:0;background:transparent;padding:4px 0;font-size:14px}.file-toggle span:last-child{min-width:0;overflow-wrap:anywhere}.file-chevron{display:inline-block;flex:none;width:16px;text-align:center;font-size:20px;line-height:1}.file-toggle[aria-expanded="true"] .file-chevron{transform:rotate(90deg)}#preview-section{width:100%;min-width:0;padding-inline-start:24px}#file-title{font-size:12px;font-weight:normal;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;font-size:12px;padding:12px;background:var(--color-background-secondary,ButtonFace)}img{display:block;max-width:100%;max-height:480px;object-fit:contain}#error{border-inline-start:3px solid Mark;padding-inline-start:10px}a{color:LinkText} [hidden]{display:none!important}
#decision,#review{border:1px solid var(--color-border-primary,GrayText);border-radius:8px;padding:12px;margin:12px 0}#decision h2,#review h2{margin:0 0 8px}#decision-options{border:0;padding:0;margin:8px 0}#decision-options label{display:flex;gap:8px;align-items:flex-start;padding:6px 0}#decision-options input{margin-top:4px}#decision-options small{display:block;opacity:.7}textarea{display:block;width:100%;min-height:68px;font:inherit;padding:8px;margin:6px 0;resize:vertical;color:inherit;background:var(--color-background-primary,Canvas);border:1px solid var(--color-border-primary,GrayText);border-radius:6px}#decision-question,#decision-why,#decision-answer{overflow-wrap:anywhere;white-space:pre-wrap}
#file-rendered{max-height:440px;overflow:auto;overflow-wrap:anywhere;border:1px solid var(--color-border-primary,GrayText);border-radius:6px;padding:12px}#file-rendered h1{font-size:20px}#file-rendered h2{font-size:18px}#file-rendered h3{font-size:16px}#file-rendered h1,#file-rendered h2,#file-rendered h3{margin:12px 0 8px}#file-rendered>:first-child{margin-top:0}#file-rendered pre{max-height:none;margin:0}#file-rendered table{border-collapse:collapse;width:100%;font-size:12px}#file-rendered th,#file-rendered td{border:1px solid var(--color-border-primary,GrayText);padding:6px;text-align:start}#file-rendered blockquote{border-inline-start:3px solid GrayText;margin:8px 0;padding-inline-start:12px}#file-viewer-toolbar{margin:8px 0}#file-viewer-toolbar [aria-pressed="true"]{outline:1px solid currentColor;background:var(--color-background-secondary,ButtonFace)}.token.comment,.token.prolog{color:light-dark(#52616b,#a7bbc7)}.token.keyword,.token.boolean,.token.atrule{color:light-dark(#7536a5,#dbaaff)}.token.string,.token.attr-value{color:light-dark(#27683d,#9fdbac)}.token.number,.token.constant{color:light-dark(#9a3e13,#ffb990)}.token.property,.token.tag,.token.function{color:light-dark(#165d99,#91caff)}
</style></head><body>
<main aria-busy="true"><h1 id="title">Atoma</h1><p id="status" role="status" aria-live="polite"></p><p id="activity" class="muted"></p>
<div class="actions"><button id="refresh" type="button"></button><button id="cancel" type="button" hidden></button></div>
<p id="error" role="alert" hidden></p><p id="receipt"></p><p id="cost" class="muted"></p>
<section id="decision" hidden aria-labelledby="decision-title"><h2 id="decision-title"></h2><p id="decision-question"></p><p id="decision-why" class="muted"></p><p id="decision-answer"></p><div id="decision-form" role="form" aria-labelledby="decision-title"><fieldset id="decision-options"><legend id="decision-legend"></legend><div id="decision-choices"></div><label><input type="radio" name="decision" value=""><span id="decision-other-copy"></span></label></fieldset><label id="decision-text-label" for="decision-text"></label><textarea id="decision-text" maxlength="2000"></textarea><p id="decision-hint" class="muted"></p><button id="decision-submit" type="button"></button></div><p id="decision-state" role="status" aria-live="polite"></p><button id="decision-open" type="button" hidden></button></section>
<section id="criteria-section" hidden><h2 id="criteria-title"></h2><ul id="criteria"></ul></section>
<section id="files-section" hidden><h2 id="files-title"></h2><ul id="files"></ul><button id="more-files" type="button" hidden></button></section>
<section id="preview-section" hidden aria-labelledby="file-title"><h2 id="file-title"></h2><img id="image" hidden alt=""><div id="file-viewer-toolbar" class="actions" role="group" hidden><button id="file-viewer-preview" type="button" aria-controls="file-rendered" aria-pressed="true"></button><button id="file-viewer-source" type="button" aria-controls="text" aria-pressed="false"></button></div><p id="file-viewer-note" class="muted"></p><div id="file-rendered" hidden></div><pre id="text" hidden></pre><button id="more-text" type="button" hidden></button></section>
<section id="review" hidden aria-labelledby="review-title"><h2 id="review-title"></h2>
<p id="review-evidence" class="muted"></p><details><summary id="review-identity-title" class="muted"></summary><p id="review-identity" class="muted" style="overflow-wrap:anywhere"></p></details>
<p id="review-files-state"></p><p id="review-comparison"></p><p id="review-comparison-note" class="muted"></p><ul id="review-comparison-files"></ul><button id="review-compare-more" type="button" hidden></button>
<div class="actions"><button id="review-result" type="button"></button><button id="review-test" type="button" hidden></button></div>
<div id="review-result-page" hidden><p id="review-result-range" class="muted"></p><pre id="review-result-text"></pre></div><button id="review-result-more" type="button" hidden></button>
<p id="review-acceptance" style="white-space:pre-wrap;overflow-wrap:anywhere"></p>
<div id="review-accept-form" role="form" aria-labelledby="review-title" hidden><label id="review-summary-label" for="review-summary"></label><textarea id="review-summary" maxlength="2000"></textarea><label><input id="review-consent" type="checkbox"><span id="review-consent-copy"></span></label><div class="actions"><button id="review-accept" type="button" disabled></button></div></div>
<button id="review-retry" type="button" hidden></button><p id="review-state" role="status" aria-live="polite"></p>
<label id="review-feedback-label" for="review-feedback"></label><textarea id="review-feedback" maxlength="2000"></textarea><button id="review-changes" type="button"></button>
<div id="review-handoff" hidden><p id="review-handoff-state" role="status"></p><label id="review-draft-label" for="review-draft"></label><textarea id="review-draft" readonly></textarea></div>
</section>
<p id="note" class="muted"></p></main>
<script type="application/json" id="copy"><!-- COPY --></script><script><!-- SCRIPT --></script>
</body></html>
