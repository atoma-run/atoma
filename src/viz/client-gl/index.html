<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Pre-JS fallback only; `applyDocumentLocale` replaces it from the
       catalog once the locale is known (2026-08-27, 3.13). -->
  <title>Atoma — AI agents that turn requests into checked work</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b13" />
  <meta name="application-name" content="Atoma" />
  <meta name="apple-mobile-web-app-title" content="Atoma" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- Filled at request time from the deployment's validated public origin. -->
  <!-- ATOMA_DEPLOYMENT_SEO -->
  <style>
    html, body { min-height: 100%; margin: 0; background: #070b13; }
    .atoma-boot { box-sizing: border-box; display: grid; min-height: 100vh; place-content: center; justify-items: center; gap: 14px; padding: 32px; color: #f8fbff; font: 700 clamp(32px, 8vw, 52px)/1 ui-sans-serif, system-ui, sans-serif; }
    .atoma-boot h1 { margin: 0; font: inherit; letter-spacing: -.04em; }
  </style>
</head>
<body>
  <div id="root"><main class="atoma-boot"><img src="/favicon.svg" width="72" height="72" alt="" /><h1>Atoma</h1></main></div>
  <noscript>
    <style>
      #root { display: none !important; }
      .atoma-static-landing { box-sizing: border-box; display: grid; min-height: 100vh; place-content: center; gap: 18px; padding: 32px; background: #070b13; color: #e6edf7; text-align: center; font: 16px/1.55 ui-sans-serif, system-ui, sans-serif; }
      .atoma-static-landing h1 { margin: 0; color: #f8fbff; font-size: clamp(42px, 9vw, 76px); letter-spacing: -.04em; }
      .atoma-static-landing p { max-width: 700px; margin: 0 auto; color: #a9b5ca; }
      .atoma-static-landing a { width: fit-content; margin: 8px auto 0; padding: 11px 20px; border: 1px solid #6ea8ff; border-radius: 8px; color: #e6edf7; text-decoration: none; }
    </style>
    <main class="atoma-static-landing">
      <h1>Atoma</h1>
      <p>Watch a request turn into finished work.</p>
      <p>Ask for a drawing, a sound, a report, a data study, a proof or a piece of software. AI agents produce it, check the result against what you asked for, and record every step.</p>
      <a href="/auth/login">Sign in to Atoma</a>
    </main>
  </noscript>
  <script type="module" src="/main.tsx"></script>
</body>
</html>
